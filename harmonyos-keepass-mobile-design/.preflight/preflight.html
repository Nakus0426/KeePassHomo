<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
:root {
  /* Brand: 宇宙蓝 */
  --hk-blue-50: #E6F0FE;
  --hk-blue-100: #CCE0FD;
  --hk-blue-200: #99C2FB;
  --hk-blue-300: #66A3F9;
  --hk-blue-400: #3385F8;
  --hk-blue-500: #0A59F7;
  --hk-blue-600: #0847C6;
  --hk-blue-700: #063594;
  --hk-blue-800: #042463;
  --hk-blue-900: #021231;

  /* Neutral: 雪域灰 */
  --hk-gray-0: #FFFFFF;
  --hk-gray-50: #F9FAFB;
  --hk-gray-100: #F2F4F6;
  --hk-gray-150: #E8EAED;
  --hk-gray-200: #DEE1E6;
  --hk-gray-300: #C5C9D0;
  --hk-gray-400: #9AA0AA;
  --hk-gray-500: #6B7280;
  --hk-gray-600: #4B5563;
  --hk-gray-700: #374151;
  --hk-gray-800: #1F2937;
  --hk-gray-900: #111827;

  /* State colors */
  --hk-state-success: #16A34A;
  --hk-state-success-bg: #DCFCE7;
  --hk-state-warning: #F59E0B;
  --hk-state-warning-bg: #FEF3C7;
  --hk-state-error: #DC2626;
  --hk-state-error-bg: #FEE2E2;
  --hk-state-info: #0A59F7;

  /* Semantic aliases (light) */
  --hk-background: var(--hk-gray-50);
  --hk-foreground: var(--hk-gray-900);
  --hk-card: rgba(255, 255, 255, 0.82);
  --hk-card-solid: var(--hk-gray-0);
  --hk-card-foreground: var(--hk-gray-900);
  --hk-popover: rgba(255, 255, 255, 0.90);
  --hk-popover-foreground: var(--hk-gray-900);
  --hk-primary: var(--hk-blue-500);
  --hk-primary-foreground: var(--hk-gray-0);
  --hk-muted: var(--hk-gray-100);
  --hk-muted-foreground: var(--hk-gray-500);
  --hk-border: rgba(120, 130, 150, 0.16);
  --hk-border-solid: var(--hk-gray-200);
  --hk-input: var(--hk-gray-100);
  --hk-ring: var(--hk-blue-500);

  /* Material blur levels ( HarmonyOS 沉浸光感 ) */
  --hk-material-ultra-thin: rgba(255, 255, 255, 0.55);
  --hk-material-thin: rgba(255, 255, 255, 0.72);
  --hk-material-thick: rgba(255, 255, 255, 0.86);
  --hk-material-ultra-thick: rgba(255, 255, 255, 0.94);
  --hk-blur-ultra-thin: blur(12px) saturate(180%);
  --hk-blur-thin: blur(20px) saturate(160%);
  --hk-blur-thick: blur(28px) saturate(140%);
  --hk-blur-ultra-thick: blur(36px) saturate(120%);
  --hk-backdrop-ultra-thin: blur(16px) saturate(180%);
  --hk-backdrop-thin: blur(24px) saturate(160%);
  --hk-backdrop-thick: blur(32px) saturate(140%);
  --hk-backdrop-ultra-thick: blur(40px) saturate(120%);

  /* Elevation */
  --hk-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --hk-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.14);
  --hk-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.26);
  --hk-shadow-float: 0 12px 32px -10px rgba(10, 89, 247, 0.14);

  /* Radius */
  --hk-radius-xs: 2px;
  --hk-radius-sm: 4px;
  --hk-radius-md: 8px;
  --hk-radius-lg: 12px;
  --hk-radius-xl: 16px;
  --hk-radius-pill: 9999px;

  /* Typography */
  --hk-font-sans: "HarmonyOS Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --hk-font-mono: "SF Mono", "Cascadia Mono", "HarmonyOS Sans Mono", ui-monospace, monospace;

  /* Safe area */
  --hk-safe-top: env(safe-area-inset-top, 0px);
  --hk-safe-bottom: env(safe-area-inset-bottom, 0px);

  /* Touch targets */
  --hk-touch-min: 44px;
}

html.dark {
  --hk-background: #0B0C0F;
  --hk-foreground: #F2F4F6;
  --hk-card: rgba(30, 32, 40, 0.78);
  --hk-card-solid: #181A20;
  --hk-card-foreground: #F2F4F6;
  --hk-popover: rgba(30, 32, 40, 0.90);
  --hk-popover-foreground: #F2F4F6;
  --hk-primary: #317AF7;
  --hk-primary-foreground: #FFFFFF;
  --hk-muted: rgba(255, 255, 255, 0.08);
  --hk-muted-foreground: #9AA0AA;
  --hk-border: rgba(255, 255, 255, 0.10);
  --hk-border-solid: #2A2D36;
  --hk-input: rgba(255, 255, 255, 0.08);
  --hk-ring: #317AF7;

  --hk-material-ultra-thin: rgba(20, 22, 30, 0.45);
  --hk-material-thin: rgba(20, 22, 30, 0.62);
  --hk-material-thick: rgba(20, 22, 30, 0.82);
  --hk-material-ultra-thick: rgba(20, 22, 30, 0.92);

  --hk-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --hk-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
  --hk-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
  --hk-shadow-float: 0 12px 32px -10px rgba(49, 122, 247, 0.18);
}

body {
  font-family: var(--hk-font-sans);
  background: var(--hk-background);
  color: var(--hk-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Typography scale */
.hk-text-display { font-size: 32px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }
.hk-text-h1 { font-size: 24px; line-height: 1.18; font-weight: 600; letter-spacing: -0.015em; }
.hk-text-h2 { font-size: 20px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
.hk-text-h3 { font-size: 17px; line-height: 1.3; font-weight: 600; }
.hk-text-body { font-size: 15px; line-height: 1.55; font-weight: 400; }
.hk-text-body-sm { font-size: 13px; line-height: 1.5; font-weight: 400; }
.hk-text-caption { font-size: 12px; line-height: 1.4; font-weight: 400; letter-spacing: 0.005em; }
.hk-text-mono { font-family: var(--hk-font-mono); font-size: 13px; line-height: 1.45; font-weight: 500; }

/* Material surfaces */
.hk-material-ultra-thin {
  background: var(--hk-material-ultra-thin);
  backdrop-filter: var(--hk-backdrop-ultra-thin);
  -webkit-backdrop-filter: var(--hk-backdrop-ultra-thin);
}
.hk-material-thin {
  background: var(--hk-material-thin);
  backdrop-filter: var(--hk-backdrop-thin);
  -webkit-backdrop-filter: var(--hk-backdrop-thin);
}
.hk-material-thick {
  background: var(--hk-material-thick);
  backdrop-filter: var(--hk-backdrop-thick);
  -webkit-backdrop-filter: var(--hk-backdrop-thick);
}
.hk-material-ultra-thick {
  background: var(--hk-material-ultra-thick);
  backdrop-filter: var(--hk-backdrop-ultra-thick);
  -webkit-backdrop-filter: var(--hk-backdrop-ultra-thick);
}

/* Reduced transparency fallback */
@media (prefers-reduced-transparency: reduce) {
  .hk-material-ultra-thin,
  .hk-material-thin,
  .hk-material-thick,
  .hk-material-ultra-thick {
    background: var(--hk-card-solid);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">

    --color-background: var(--hk-background);
    --color-foreground: var(--hk-foreground);
    --color-card: var(--hk-card);
    --color-card-foreground: var(--hk-card-foreground);
    --color-popover: var(--hk-popover);
    --color-popover-foreground: var(--hk-popover-foreground);
    --color-primary: var(--hk-primary);
    --color-primary-foreground: var(--hk-primary-foreground);
    --color-muted: var(--hk-muted);
    --color-muted-foreground: var(--hk-muted-foreground);
    --color-border: var(--hk-border);
    --color-input: var(--hk-input);
    --color-ring: var(--hk-ring);
    --radius-sm: var(--hk-radius-sm);
    --radius-md: var(--hk-radius-md);
    --radius-lg: var(--hk-radius-lg);
    --radius-xl: var(--hk-radius-xl);
  }
  @layer base {
    body { background: var(--hk-background); color: var(--hk-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-card-foreground { color: var(--hk-card-foreground); }
      .border-card-foreground { border-color: var(--hk-card-foreground); }

      .bg-primary { background-color: var(--hk-primary); }
      .text-primary { color: var(--hk-primary); }
      .border-primary { border-color: var(--hk-primary); }
      .ring-primary { --tw-ring-color: var(--hk-primary); }
      .bg-primary-foreground { background-color: var(--hk-primary-foreground); }
      .text-primary-foreground { color: var(--hk-primary-foreground); }
      .border-primary-foreground { border-color: var(--hk-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--hk-primary-foreground); }
      .bg-muted { background-color: var(--hk-muted); }
      .text-muted { color: var(--hk-muted); }

      .bg-border { background-color: var(--hk-border); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      }
    </style>
</head>
