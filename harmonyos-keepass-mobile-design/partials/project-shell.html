<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HarmonyOS KeePass Mobile Shell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style id="theme-vars">
    @theme inline {
      --color-background: var(--hk-background);
      --color-foreground: var(--hk-foreground);
      --color-card: var(--hk-card);
      --color-card-foreground: var(--hk-card-foreground);
      --color-popover: var(--hk-popover);
      --color-popover-foreground: var(--hk-popover-foreground);
      --color-primary: var(--hk-primary);
      --color-primary-foreground: var(--hk-primary-foreground);
      --color-muted: var(--hk-muted);
      --color-muted-foreground: var(--hk-muted-foreground);
      --color-border: var(--hk-border);
      --color-input: var(--hk-input);
      --color-ring: var(--hk-ring);
      --radius-sm: var(--hk-radius-sm);
      --radius-md: var(--hk-radius-md);
      --radius-lg: var(--hk-radius-lg);
      --radius-xl: var(--hk-radius-xl);
    }
  </style>
  <style id="semantic-token-fallback">
    @layer base {
      :root { --background: var(--hk-background); --foreground: var(--hk-foreground); --card: var(--hk-card); --card-foreground: var(--hk-card-foreground); --popover: var(--hk-popover); --popover-foreground: var(--hk-popover-foreground); --primary: var(--hk-primary); --primary-foreground: var(--hk-primary-foreground); --muted: var(--hk-muted); --muted-foreground: var(--hk-muted-foreground); --border: var(--hk-border); --input: var(--hk-input); --ring: var(--hk-ring); }
    }
  </style>
  <style id="critical-layout">
    html, body { min-height: 100%; }
    body { font-family: var(--hk-font-sans); }
    .phone-shell { width: 100%; max-width: 390px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--hk-background); }
    .status-bar { height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 24px 8px; font-size: 14px; font-weight: 600; color: var(--hk-foreground); }
    .safe-top { padding-top: 44px; }
    .safe-bottom { padding-bottom: 84px; }
    .bottom-nav { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom, 12px)); transform: translateX(-50%); z-index: 50; }
  </style>
</head>
<body class="bg-[var(--hk-background)] text-[var(--hk-foreground)]">
  <div class="phone-shell">
    <!-- Status Bar -->
    <div class="status-bar fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[390px] z-50" data-shell="status-bar">
      <span>9:41</span>
      <div class="flex items-center gap-1">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M1 9h2v2H1zm3-3h2v5H4zm3-2h2v7H7zm3 3h2v4h-2zm3-2h2v6h-2z"/></svg>
        <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="2" width="18" height="8" rx="2" stroke="currentColor" fill="none"/><rect x="3" y="4" width="14" height="4" rx="1"/></svg>
      </div>
    </div>

    <!-- Main content slot -->
    <main id="page-content" class="safe-top safe-bottom">
      <!-- SLOT: pageBody -->
    </main>

    <!-- Bottom floating nav capsule -->
    <nav data-shell="bottom-nav" class="bottom-nav hk-material-thin rounded-full shadow-[var(--hk-shadow-2)] border border-[var(--hk-border)] px-2 py-2">
      <div class="flex items-center gap-1">
        <a href="#" data-nav-key="vault" data-dom-id="nav-vault" class="flex flex-col items-center justify-center min-w-[64px] h-[44px] rounded-full text-[var(--hk-primary)] bg-[var(--hk-primary)]/10 transition-colors">
          <svg data-lucide="shield-check" class="w-5 h-5"></svg>
          <span class="text-[10px] leading-none mt-0.5 font-medium">保险库</span>
        </a>
        <a href="#" data-nav-key="security" data-dom-id="nav-security" class="flex flex-col items-center justify-center min-w-[64px] h-[44px] rounded-full text-[var(--hk-muted-foreground)] hover:text-[var(--hk-foreground)] transition-colors">
          <svg data-lucide="fingerprint" class="w-5 h-5"></svg>
          <span class="text-[10px] leading-none mt-0.5 font-medium">安全中心</span>
        </a>
        <a href="#" data-nav-key="generator" data-dom-id="nav-generator" class="flex flex-col items-center justify-center min-w-[64px] h-[44px] rounded-full text-[var(--hk-muted-foreground)] hover:text-[var(--hk-foreground)] transition-colors">
          <svg data-lucide="key-round" class="w-5 h-5"></svg>
          <span class="text-[10px] leading-none mt-0.5 font-medium">生成器</span>
        </a>
        <a href="#" data-nav-key="settings" data-dom-id="nav-settings" class="flex flex-col items-center justify-center min-w-[64px] h-[44px] rounded-full text-[var(--hk-muted-foreground)] hover:text-[var(--hk-foreground)] transition-colors">
          <svg data-lucide="settings" class="w-5 h-5"></svg>
          <span class="text-[10px] leading-none mt-0.5 font-medium">设置</span>
        </a>
      </div>
    </nav>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
